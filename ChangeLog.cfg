        VERSION
        {
                version = 0.0.4.147
                change = Improved support for B9partSwitch, now supports NODE and MODULE stanza

                change = Improved logging support
                add = Added logging of all screen messages
                change = Added wordwrap to the onscreen messages under the widgets

                change = Fixed B9 issue with nodes being lost when switching between different B9PS meshe
                type = update
        }

        VERSION
        {
                version = 0.0.4.137
                change = Added window containing all controls in the PAW for easier access to all controls.
                change = Added ability to hide the PAW window and controls when not needed.
                change = Added ability to specify face tilt in PAW instead of dragging
                change = Fixed issue with morphing not working correctly when the attached part is a child of another part.
                change = Fixed issue when moving handle quickly and the morphing would not update correctly.
                change = Added attached part morphing for parts that have morphing enabled. This allows the attached part to morph along with the parent part.
                change = Added option to settings to have this morphing option enabled or disabled.
                change = Added face morphing for attached parts which adjusts the face of the attached part to match the morphed face.
                change = Improved support for B9partSwitch

                change = Added window containing all controls in the PAW for easier access to all controls.
