// PartSculptor global configuration. Values are read once when KSP loads.
PARTSCULPTOR_SETTINGS
{
    // Individual axis values for the PAW's float edit controls.
    minScale = 0.05
    maxScale = 100
    incrementLarge = 0.25
    incrementSmall = 0.05
    incrementSlide = 0.001
    scaleChildrenDefault = false
    lockProportionsDefault = false
    // Ordinary morph corner drags keep X and Z in the same ratio by default.
    // Overridden by the user Settings window and each part's saved PAW toggle.
    lockMorphXZDefault = true

    // On newly attaching a stack part, match the connected node's physical
    // diameter. For axial nodes, only the two face axes are resized. Saved
    // craft geometry is never auto-matched on load. Also toggleable in PAW.
    // Initial default when no PluginData/UserSettings.cfg preference exists.
    // Change the saved preference in Vessel Inspector -> Settings.
    matchNodeSizesDefault = false

    // Editor gizmo: open using "Show scaling gizmo" in the Stretch Scale PAW.
    // Red = local X, green = local Y, blue = local Z. Drag a colored cube.
    // Hold Shift to move in 0.05 increments; Esc/right-click cancels the drag.
    // No extra dependencies; gizmo is editor-only and not saved in craft files.

    // Safety caps. Mass is the additional PartSculptor dry-mass factor
    // (X*Y*Z). Volume also includes TweakScale's uniform factor cubed.
    // These values do NOT silently reshape previously saved vessels.
    maxMassMultiplier = 10000
    maxVolumeMultiplier = 10000

    // Display a warning in the PAW for scale factors >= the threshold,
    // or <= its reciprocal (e.g., 100x or 0.01x).
    warnMassMultiplier = 100
    warnVolumeMultiplier = 100

    // Career Mode progression (only in the VAB or SPH). The active editor's
    // facility level determines the tier; Sandbox and Science are unaffected.
    // Each tier restricts per-axis scaling and the additional X*Y*Z volume.
    // Existing craft scales are kept when loading; new edits obey the limits.
    enableCareerLimits = true
    careerLevel1MinScale = 0.75
    careerLevel1MaxScale = 1.5
    careerLevel1MaxVolume = 3
    careerLevel2MinScale = 0.5
    careerLevel2MaxScale = 3
    careerLevel2MaxVolume = 27
    careerLevel3MinScale = 0.25
    careerLevel3MaxScale = 10
    careerLevel3MaxVolume = 1000

    // Optional block list. Set true to disallow NEW scaling on parts
    // containing matching modules; saved dimensions are preserved.
    restrictWheels = false
    restrictDockingPorts = false

    // Docking ports: scale the physical acquisition/capture distances from
    // immutable prefab values using the docking FACE dimensions (not length).
    // Auto-type stock size0/size1/size2 ports to a matching physical diameter;
    // intermediate sizes receive PartSculptorDock_<mm>mm compatibility labels.
    // Only matching ports of the same size can dock. Custom/gendered/multi-type
    // docking setups and joined ports are not rewritten.
    scaleDockingCaptureDistances = true
    matchDockingPortTypes = true
    // Relative tolerance for mapping a physical diameter to a stock port type.
    dockingStockSizeTolerance = 0.05
    restrictAnimatedParts = false

    // Silent fuel-switcher compatibility: ordinary stock tanks are only
    // checked after actual resource changes, not every few frames.
    resourceFallbackSeconds = 10
    checkAllResourcesPeriodically = false

    // Visual engine FX support. The resized model automatically scales effects
    // under it. External stock particle emitters / Waterfall effect meshes get
    // non-compounding scale wrappers. No Waterfall DLL is required.
    scaleEngineEffects = true
    scaleWaterfallEffects = true
    // Check for FX created late or recreated by a variant/engine switch.
    effectRefreshSeconds = 2

    // Logs every actual change, including mass/cost modifier results, resources,
    // exponent fields/curves, dimensions, attach nodes and movement in KSP.log.
    // Defaults: ON in Debug builds, OFF in Release builds.
    // Uncomment to override the default for either build:
    // debugLogChanges = true
}
