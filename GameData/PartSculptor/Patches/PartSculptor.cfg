// PartSculptor: add to all eligible parts, including crewed parts.
// Exclude Procedural Parts and other geometry/part-management modules.
// A single matching MODULE on a part prevents automatic injection.
// Also omit parts whose MODEL path belongs to ModularSegmentedSRBs.
// Restrict by part model path; :NEEDS[!ModularSegmentedSRBs] would
// incorrectly prevent injection into every part when the mod is installed.
// Exclude EVA Kerbals (all suits), planted flags and standalone flag panels.
// Do not exclude normal parts just because they have a FlagDecal module.
// Avoid duplicates if PartSculptor has already been added.
@PART[*]:HAS[!MODULE[ModulePartSculptor],!MODULE[ProceduralPart],!MODULE[WingProcedural],!MODULE[SmartTankPart],!MODULE[DiameterMatcher],!MODULE[TextureDefaulter],!MODEL:HAS[#model[ModularSegmentedSRBs/*]],!MODULE[KerbalEVA],!MODULE[FlagSite],!MODULE[FlagDecalBackground],~name[kerbalEVA*],~name[flag],~name[FlagSite],~name[flagPart*]]:NEEDS[PartSculptor]:FINAL
{
    MODULE
    {
        name = ModulePartSculptor
    }
}
