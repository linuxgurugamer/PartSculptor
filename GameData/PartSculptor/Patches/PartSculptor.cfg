// PartSculptor: add to all eligible parts, including crewed parts.
// Procedural Parts generates its own geometry and should not be sculpted.
// Avoid duplicates if PartSculptor has already been added.
@PART[*]:HAS[!MODULE[ModulePartSculptor],!MODULE[ProceduralPart]]:NEEDS[PartSculptor]:FINAL
{
    MODULE
    {
        name = ModulePartSculptor
    }
}
